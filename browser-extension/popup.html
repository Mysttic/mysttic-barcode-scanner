<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 12px; background: #10151c; color: #e6ecf5;
         font: 13px system-ui, "Segoe UI", sans-serif; }
  label { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer; }
  button { width: 100%; background: #26324a; color: #e6ecf5; border: 1px solid #2b3648;
           border-radius: 8px; padding: 7px 0; cursor: pointer; }
  button:hover { border-color: #3b82f6; }
  .hint { color: #8a97ab; font-size: 12px; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
  <label><input type="checkbox" id="enabled"> nasłuch włączony</label>
  <button id="options">Profile stron…</button>
  <p class="hint">Na stronie z profilem w rogu widać plakietkę 📷.
  Skan ramki <span id="prefix">WEB;</span>… wypełnia pola.</p>
  <script src="profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>

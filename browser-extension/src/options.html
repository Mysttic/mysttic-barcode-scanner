<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Profile formularzy</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; color: #0f172a; background: #f4f6f9; }
  h1 { font-size: 1.2rem; }
  .card { background: #fff; border: 1px solid #d8dee8; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid #eef1f6; vertical-align: top; }
  code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font-size: .85em; }
  textarea { width: 100%; height: 320px; font-family: ui-monospace, monospace; font-size: .82rem; border: 1px solid #c5cdd9; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: .9rem; cursor: pointer; margin-right: 8px; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  button.danger { background: #dc2626; }
  .log { margin-top: 10px; font-size: .85rem; min-height: 20px; }
  .log.err { color: #dc2626; }
  .log.ok { color: #16a34a; }
  .hint { color: #64748b; font-size: .85rem; line-height: 1.6; }
</style>
</head>
<body>
  <h1>Profile formularzy</h1>
  <p class="hint">Profil laczy trzy rzeczy: <b>gdzie</b> dziala (adres + wymagane pola),
  <b>jak</b> rozlozyc kod na pola (parse) i <b>gdzie</b> wstawic wartosci (selektory).
  Uklad jest celowo taki sam jak w profilach czytnika.</p>

  <div class="card">
    <h2 style="font-size:1rem">Zapisane profile</h2>
    <table id="lista"><tbody></tbody></table>
  </div>

  <div class="card">
    <h2 style="font-size:1rem">Konfiguracja (JSON)</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="log" id="log"></div>
    <p>
      <button id="zapisz">Zapisz</button>
      <button class="ghost" id="eksport">Eksportuj do pliku</button>
      <button class="ghost" id="import">Importuj z pliku</button>
      <button class="danger" id="reset">Przywroc domyslne</button>
    </p>
    <input type="file" id="plik" accept="application/json" hidden>
  </div>
  <script src="store.js"></script>
  <script src="options.js"></script>
</body>
</html>

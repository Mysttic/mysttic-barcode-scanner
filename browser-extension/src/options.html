<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form profiles</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; color: #0f172a; background: #f4f6f9; }
  h1 { font-size: 1.2rem; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .lang { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: #64748b; }
  .lang select { padding: 3px 6px; font-size: .85rem; }
  .card { background: #fff; border: 1px solid #d8dee8; border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .profil { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .profil.off { opacity: .55; }
  .prow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .prow + .prow { margin-top: 8px; }
  .prow label.chk { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: #445; white-space: nowrap; }
  .prow input[type=text] { flex: 1; min-width: 160px; padding: 6px 9px; border: 1px solid #c5cdd9; border-radius: 8px; font-size: .9rem; }
  .prow .lbl { font-size: .8rem; color: #64748b; white-space: nowrap; }
  .prow button { padding: 5px 10px; font-size: .82rem; margin-right: 0; }
  .pola { font-size: .8rem; color: #64748b; margin-top: 6px; }
  code { background: #eef1f6; padding: 1px 5px; border-radius: 4px; font-size: .85em; }
  textarea { width: 100%; height: 320px; font-family: ui-monospace, monospace; font-size: .82rem; border: 1px solid #c5cdd9; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #be123c; color: #fff; font-size: .9rem; cursor: pointer; margin-right: 8px; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  button.danger { background: #fff; color: #b91c1c; box-shadow: inset 0 0 0 1px #f0a8b4; }
  .log { margin-top: 10px; font-size: .85rem; min-height: 20px; }
  .log.err { color: #dc2626; }
  .log.ok { color: #16a34a; }
  .hint { color: #64748b; font-size: .85rem; line-height: 1.6; }
</style>
</head>
<body>
  <div class="top">
    <h1 data-i18n="options.title">Form profiles</h1>
    <label class="lang">
      <span data-i18n="lang.label">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </label>
  </div>
  <p class="hint" data-i18n-html="options.intro"></p>

  <div class="card">
    <h2 style="font-size:1rem" data-i18n="options.savedHeading">Saved profiles</h2>
    <p class="hint" data-i18n-html="options.newHint"></p>
    <p class="hint" data-i18n-html="options.orderHint"></p>
    <div id="lista"></div>
  </div>

  <div class="card">
    <h2 style="font-size:1rem" data-i18n="options.jsonHeading">Configuration (JSON)</h2>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="log" id="log"></div>
    <p>
      <button id="zapisz" data-i18n="options.save">Save</button>
      <button class="ghost" id="eksport" data-i18n="options.export">Export to a file</button>
      <button class="ghost" id="import" data-i18n="options.import">Import from a file</button>
      <button class="danger" id="reset" data-i18n="options.reset">Restore the defaults</button>
    </p>
    <input type="file" id="plik" accept="application/json" hidden>
  </div>
  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="options.js"></script>
</body>
</html>

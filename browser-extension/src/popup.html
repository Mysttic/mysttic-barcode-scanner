<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #0f172a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .status { border: 1px solid #d8dee8; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 12px; }
  .status b { display: block; margin-top: 2px; }
  .off { color: #64748b; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
</style>
</head>
<body>
  <h1>Czytnik kodow - formularze</h1>
  <div class="status" id="status">sprawdzanie...</div>
  <label><input type="checkbox" id="enabled"> Wtyczka wlaczona</label>
  <button id="learn">Ucz formularza</button>
  <button class="ghost" id="options">Profile formularzy</button>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 14px; color: #0f172a; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .status { border: 1px solid #d8dee8; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 12px; }
  .status b { display: block; margin-top: 2px; }
  .off { color: #64748b; }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 12px; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #be123c; color: #fff; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  .lang { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 0; font-size: 12px; color: #64748b; }
  .lang select { padding: 3px 6px; font-size: 12px; }
</style>
</head>
<body>
  <h1>Mysttic Barcode Scanner</h1>
  <div class="status" id="status" data-i18n="popup.checking">checking…</div>
  <label><input type="checkbox" id="enabled"> <span data-i18n="popup.enabled">Extension on</span></label>
  <button id="learn" data-i18n="popup.learn">Teach a form</button>
  <button class="ghost" id="options" data-i18n="popup.options">Form profiles</button>
  <div class="lang">
    <span data-i18n="lang.label">Language</span>
    <select id="lang">
      <option value="en">English</option>
      <option value="pl">Polski</option>
    </select>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>

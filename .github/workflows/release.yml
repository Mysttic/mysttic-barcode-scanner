# Buduje i publikuje wydanie po zmergowaniu PR z develop do master.
# Wersja wydania = VERSION.md (jedyne zrodlo prawdy; CI tworzy tag v<wersja>).
# Bez PODNIESIENIA wersji w VERSION.md release sie NIE wykonuje (czysty skip).
name: release

on:
  pull_request:
    types: [closed]
    branches: [master]

env:
  CIRCUITPYTHON_URL: https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-10.2.1.uf2
  BUNDLE_URL: https://github.com/adafruit/Adafruit_CircuitPython_Bundle/releases/download/20260818/adafruit-circuitpython-bundle-10.x-mpy-20260818.zip

jobs:
  build:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Czy wersja w VERSION.md zostala podniesiona?
        id: ver
        run: |
          VERSION=$(grep -oP '\b\d+\.\d+\.\d+\b' VERSION.md | head -1)
          test -n "$VERSION" || { echo "::error::Brak wersji X.Y.Z w VERSION.md"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PREV=$(git show 'HEAD^1:VERSION.md' 2>/dev/null | grep -oP '\b\d+\.\d+\.\d+\b' | head -1 || true)
          echo "poprzednia=$PREV nowa=$VERSION"
          if [ "$PREV" = "$VERSION" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Wersja niezmieniona — pomijam wydanie."
          elif git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION już istnieje — pomijam wydanie."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.release == 'true'
        with:
          python-version: "3.12"

      - name: Pobranie CircuitPython UF2 i biblioteki adafruit_hid
        if: steps.ver.outputs.release == 'true'
        run: |
          mkdir -p hardware/downloads/extracted
          curl -fsSL -o "hardware/downloads/$(basename "$CIRCUITPYTHON_URL")" "$CIRCUITPYTHON_URL"
          curl -fsSL -o /tmp/bundle.zip "$BUNDLE_URL"
          unzip -o -q /tmp/bundle.zip "*/lib/adafruit_hid/*" -d hardware/downloads/extracted

      - name: Build konfiguratora
        if: steps.ver.outputs.release == 'true'
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Budowa paczki wydania
        if: steps.ver.outputs.release == 'true'
        run: python tools/build_release.py --skip-npm

      - name: Publikacja wydania (tworzy tag automatycznie)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            release/barcode-reader-v*.zip
            release/barcode-reader-v*.zip.sha256
          body_path: CHANGELOG.md

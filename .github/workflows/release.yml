# Buduje i publikuje wydanie po zmergowaniu PR z develop do master.
# Wersja wydania = VERSION.md (jedyne zrodlo prawdy; CI tworzy tag v<wersja>).
# Bez PODNIESIENIA wersji w VERSION.md release sie NIE wykonuje (czysty skip).
# Reczne odpalenie (workflow_dispatch) wydaje wersje z VERSION.md na masterze,
# o ile nie ma jeszcze jej tagu - tak powtarza sie wydanie przewrocone przez
# awarie infrastruktury.
name: release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

env:
  CIRCUITPYTHON_URL: https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-10.2.1.uf2
  BUNDLE_URL: https://github.com/adafruit/Adafruit_CircuitPython_Bundle/releases/download/20260818/adafruit-circuitpython-bundle-10.x-mpy-20260818.zip

jobs:
  # Testy agenta wymagaja Windowsa (UI Automation, WinForms). Same pliki exe
  # sklada juz job "build" - przekazywanie ich miedzy jobami przez artefakty
  # potrafi przewrocic wydanie, gdy skonczy sie magazyn artefaktow.
  testy-agenta:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Testy jednostkowe agenta
        run: dotnet run -c Release --project desktop-agent/tests/TestyAgenta --nologo

  build:
    needs: testy-agenta
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2

      - name: Czy wersja w VERSION.md zostala podniesiona?
        id: ver
        run: |
          VERSION=$(grep -oP '\b\d+\.\d+\.\d+\b' VERSION.md | head -1)
          test -n "$VERSION" || { echo "::error::Brak wersji X.Y.Z w VERSION.md"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          PREV=$(git show 'HEAD^1:VERSION.md' 2>/dev/null | grep -oP '\b\d+\.\d+\.\d+\b' | head -1 || true)
          echo "poprzednia=$PREV nowa=$VERSION zdarzenie=${{ github.event_name }}"
          if [ "$PREV" = "$VERSION" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Wersja niezmieniona — pomijam wydanie."
          elif git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION już istnieje — pomijam wydanie."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.release == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.release == 'true'
        with:
          python-version: "3.12"

      # Agent desktopowy jest aplikacja Windows, ale .NET potrafi zlozyc dla niej
      # samodzielny plik exe takze z Linuksa (EnableWindowsTargeting).
      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.release == 'true'
        with:
          dotnet-version: "9.0.x"

      - name: Pobranie CircuitPython UF2 i biblioteki adafruit_hid
        if: steps.ver.outputs.release == 'true'
        run: |
          mkdir -p hardware/downloads/extracted
          curl -fsSL -o "hardware/downloads/$(basename "$CIRCUITPYTHON_URL")" "$CIRCUITPYTHON_URL"
          curl -fsSL -o /tmp/bundle.zip "$BUNDLE_URL"
          unzip -o -q /tmp/bundle.zip "*/lib/adafruit_hid/*" -d hardware/downloads/extracted

      - name: Build konfiguratora
        if: steps.ver.outputs.release == 'true'
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build

      # Firmware produkcyjny (C) ma konfigurator i instrukcje w srodku (dysk
      # CZYTNIK), wiec kompilujemy go PO buildzie konfiguratora.
      - name: Narzedzia ARM
        if: steps.ver.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Cache Pico SDK
        if: steps.ver.outputs.release == 'true'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2-tinyusb

      - name: Pobranie Pico SDK
        if: steps.ver.outputs.release == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb

      - name: Kompilacja firmware produkcyjnego (UF2 z dyskiem CZYTNIK)
        if: steps.ver.outputs.release == 'true'
        working-directory: firmware-pico-sdk
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja -C build

      - name: Budowa paczki wydania (z agentem i aplikacja testowa)
        if: steps.ver.outputs.release == 'true'
        run: python tools/build_release.py --skip-npm

      - name: Publikacja wydania (tworzy tag automatycznie)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.ver.outputs.sha }}
          name: v${{ steps.ver.outputs.version }}
          files: |
            release/barcode-reader-v*.zip
            release/barcode-reader-v*.zip.sha256
            release/aplikacja-testowa-v*.zip
            release/aplikacja-testowa-v*.zip.sha256
          body_path: CHANGELOG.md

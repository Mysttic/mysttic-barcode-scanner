# CI: testy jednostkowe + budowa artefaktow + PACZKA TESTOWA.
# - PR do master: testy Python, testy C, testy wtyczki, build konfiguratora, UF2.
# - reczne odpalenie (workflow_dispatch, np. na develop przed zrobieniem PR):
#   to samo + pelna paczka wydania jako ARTIFACT (bez publikacji release).
name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CIRCUITPYTHON_URL: https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-10.2.1.uf2
  BUNDLE_URL: https://github.com/adafruit/Adafruit_CircuitPython_Bundle/releases/download/20260818/adafruit-circuitpython-bundle-10.x-mpy-20260818.zip

jobs:
  tests-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host tests: CircuitPython firmware
        working-directory: firmware-circuitpython
        run: python tests/test_firmware.py

  tests-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests: C modules
        working-directory: firmware-pico-sdk
        run: |
          gcc -Wall -Wextra -Werror -I src tests/test_host.c src/scan_framer.c src/parser_gs1.c src/mini_regex.c src/config_parse.c src/profile_matcher.c -o test_host
          ./test_host

  configurator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - name: Build (tsc type check + vite single-file)
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      # Artefakt jest pomocniczy (podglad builda) - wyczerpany limit magazynu
      # na koncie nie moze przewracac calego CI.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: configurator
          path: configurator/dist/index.html
          retention-days: 7

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install dependencies
        working-directory: browser-extension
        run: npm ci --no-fund --no-audit
      - name: Unit tests (parsing, address matching)
        working-directory: browser-extension
        run: npm test
      - name: E2E tests (Chromium with the extension loaded plus a demo form)
        working-directory: browser-extension
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a npm run test:e2e

  firmware-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      # Konfigurator jest wbudowywany w obraz dysku MYSTTIC wewnatrz UF2,
      # wiec musi powstac PRZED kompilacja firmware.
      - name: Build the configurator (it lands on the MYSTTIC disk)
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2-tinyusb
      - name: Fetch the Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb
      - name: Compile the UF2
        working-directory: firmware-pico-sdk
        env:
          PICO_SDK_PATH: ~/pico-sdk
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja -C build
          ls -la build/mysttic_barcode_scanner.uf2
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: firmware-c-uf2
          path: firmware-pico-sdk/build/mysttic_barcode_scanner.uf2
          retention-days: 7

  desktop-agent-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Agent unit tests
        run: dotnet run -c Release --project desktop-agent/tests/TestyAgenta --nologo
      # Testy e2e agenta wymagaja pulpitu z prawdziwymi oknami i sterowania mysza,
      # wiec uruchamiamy je lokalnie (desktop-agent/tests/test_e2e.py), nie w CI.

  # Paczke wydania sklada Linux, wiec to on musi umiec zlozyc pliki exe agenta
  # (EnableWindowsTargeting). Sprawdzamy to w kazdym PR, zeby wydanie nie
  # przewrocilo sie dopiero po merge.
  agent-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Agent and demo application (self-contained Windows exes)
        run: >
          for projekt in desktop-agent/src/CzytnikAgent desktop-agent/test-app; do
          dotnet publish "$projekt" -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:EnableWindowsTargeting=true
          -p:DebugType=none -o "publish/$(basename "$projekt")" --nologo || exit 1;
          done
      - name: Check that the exes were produced
        run: |
          test -s publish/CzytnikAgent/MystticBarcodeAgent.exe
          test -s publish/test-app/MystticDemoApp.exe
          file publish/CzytnikAgent/MystticBarcodeAgent.exe

  test-package:
    needs: [tests-python, tests-c, configurator, extension, firmware-c, desktop-agent-tests, agent-exe]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Fetch the CircuitPython UF2 and the adafruit_hid library
        run: |
          mkdir -p hardware/downloads/extracted
          curl -fsSL -o "hardware/downloads/$(basename "$CIRCUITPYTHON_URL")" "$CIRCUITPYTHON_URL"
          curl -fsSL -o /tmp/bundle.zip "$BUNDLE_URL"
          unzip -o -q /tmp/bundle.zip "*/lib/adafruit_hid/*" -d hardware/downloads/extracted
      - name: Build the configurator
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      # Firmware produkcyjny budujemy tu od nowa (a nie z artefaktu joba
      # firmware-c) - paczka nie moze zalezec od limitu magazynu artefaktow.
      - name: ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2-tinyusb
      - name: Fetch the Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb
      - name: Compile the production firmware
        working-directory: firmware-pico-sdk
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja -C build
      # Paczka jest skladana dokladnie tak, jak przy wydaniu - z agentem
      # desktopowym i osobnym zipem aplikacji testowej.
      - name: Assemble a test package (not published)
        run: python tools/build_release.py --skip-npm
      - uses: actions/upload-artifact@v4
        with:
          name: test-package
          path: |
            release/mysttic-barcode-scanner-v*.zip
            release/mysttic-barcode-scanner-v*.zip.sha256
          retention-days: 7

# CI: testy jednostkowe + budowa artefaktow + PACZKA TESTOWA.
# - PR do master: testy Python, testy C, testy wtyczki, build konfiguratora, UF2.
# - reczne odpalenie (workflow_dispatch, np. na develop przed zrobieniem PR):
#   to samo + pelna paczka wydania jako ARTIFACT (bez publikacji release).
name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CIRCUITPYTHON_URL: https://downloads.circuitpython.org/bin/raspberry_pi_pico/en_US/adafruit-circuitpython-raspberry_pi_pico-en_US-10.2.1.uf2
  BUNDLE_URL: https://github.com/adafruit/Adafruit_CircuitPython_Bundle/releases/download/20260818/adafruit-circuitpython-bundle-10.x-mpy-20260818.zip

jobs:
  testy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testy hostowe firmware CircuitPython
        working-directory: firmware-circuitpython
        run: python tests/test_firmware.py

  testy-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testy hostowe modulow C
        working-directory: firmware-pico-sdk
        run: |
          gcc -Wall -Wextra -Werror -I src tests/test_host.c src/scan_framer.c src/parser_gs1.c src/mini_regex.c src/config_parse.c src/profile_matcher.c -o test_host
          ./test_host

  konfigurator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - name: Build (tsc = kontrola typow + vite single-file)
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      # Artefakt jest pomocniczy (podglad builda) - wyczerpany limit magazynu
      # na koncie nie moze przewracac calego CI.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: konfigurator
          path: configurator/dist/index.html
          retention-days: 7

  wtyczka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Instalacja zaleznosci
        working-directory: browser-extension
        run: npm ci --no-fund --no-audit
      - name: Testy jednostkowe (parsowanie, dopasowanie adresow)
        working-directory: browser-extension
        run: npm test
      - name: Testy e2e (Chromium z zaladowanym rozszerzeniem + formularz demo)
        working-directory: browser-extension
        run: |
          npx playwright install --with-deps chromium
          xvfb-run -a npm run test:e2e

  firmware-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      # Konfigurator jest wbudowywany w obraz dysku CZYTNIK wewnatrz UF2,
      # wiec musi powstac PRZED kompilacja firmware.
      - name: Build konfiguratora (trafia na dysk CZYTNIK)
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Narzedzia ARM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2-tinyusb
      - name: Pobranie Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb
      - name: Kompilacja UF2
        working-directory: firmware-pico-sdk
        env:
          PICO_SDK_PATH: ~/pico-sdk
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja -C build
          ls -la build/barcode_reader.uf2
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: firmware-c-uf2
          path: firmware-pico-sdk/build/barcode_reader.uf2
          retention-days: 7

  paczka-testowa:
    needs: [testy-python, testy-c, konfigurator, wtyczka, firmware-c]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: configurator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobranie CircuitPython UF2 i biblioteki adafruit_hid
        run: |
          mkdir -p hardware/downloads/extracted
          curl -fsSL -o "hardware/downloads/$(basename "$CIRCUITPYTHON_URL")" "$CIRCUITPYTHON_URL"
          curl -fsSL -o /tmp/bundle.zip "$BUNDLE_URL"
          unzip -o -q /tmp/bundle.zip "*/lib/adafruit_hid/*" -d hardware/downloads/extracted
      - name: Build konfiguratora
        working-directory: configurator
        run: |
          npm ci --no-fund --no-audit
          npm run build
      # Firmware produkcyjny budujemy tu od nowa (a nie z artefaktu joba
      # firmware-c) - paczka nie moze zalezec od limitu magazynu artefaktow.
      - name: Narzedzia ARM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Cache Pico SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/pico-sdk
          key: pico-sdk-2-tinyusb
      - name: Pobranie Pico SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb
      - name: Kompilacja firmware produkcyjnego
        working-directory: firmware-pico-sdk
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_PATH=$HOME/pico-sdk
          ninja -C build
      - name: Budowa paczki testowej (bez publikacji)
        run: python tools/build_release.py --skip-npm
      - uses: actions/upload-artifact@v4
        with:
          name: paczka-testowa
          path: |
            release/barcode-reader-v*.zip
            release/barcode-reader-v*.zip.sha256
          retention-days: 7
